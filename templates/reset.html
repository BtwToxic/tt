<link rel="stylesheet" href="/static/style.css">

<div class="card">
  <h2>Reset Password</h2>

  {% if alert %}
    <div class="alert">{{ alert }}</div>
  {% endif %}

  <form method="post">
    <input name="code" placeholder="OTP (6 digit)">
    <input name="newpass" placeholder="New password">
    <button>Reset</button>
  </form>
</div>
